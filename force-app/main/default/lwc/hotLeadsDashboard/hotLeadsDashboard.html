<template>
    <lightning-card title="🔥 Hot Leads Action Center" icon-name="standard:lead">
        <div class="slds-p-around_medium">
            <template if:true={leadsData.length}>
                <lightning-datatable
                    key-field="Id"
                    data={leadsData}
                    columns={columns}
                    hide-checkbox-column="true"
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </template>
            <template if:false={leadsData.length}>
                <div class="slds-text-align_center slds-m-top_medium">
                    <p>No Hot Leads currently available.</p>
                </div>
            </template>
            <template if:true={error}>
                <div class="slds-text-color_error slds-m-top_medium">
                    Error loading leads. Check console for details.
                </div>
            </template>
        </div>
    </lightning-card>
</template>
